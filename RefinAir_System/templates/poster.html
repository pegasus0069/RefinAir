<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RefinAir Academic Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0e1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-align: center;
      color: #38bdf8;
    }
    .poster-img {
      max-width: 90vw;
      height: auto;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <h1>RefinAir: Your Air, Our Care!</h1>
  <img class="poster-img" src="{{ url_for('static', filename='images/refinair_poster.jpg') }}" alt="RefinAir Poster" />
</body>
</html>
